<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answers in Faith — Review Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5; padding: 16px;
  }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .header h1 { color: #f59e0b; font-size: 1.25rem; }
  .header small { color: #94a3b8; font-size: 0.75rem; display: block; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: 6px; border: none;
    font-size: 0.875rem; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: #f59e0b; color: #0f172a; }
  .btn-success { background: #22c55e; color: white; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-outline { background: transparent; border: 1px solid #334155; color: #f8fafc; }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 16px; margin-bottom: 12px;
  }
  .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem;
    font-weight: 600; text-transform: uppercase; margin-right: 4px;
  }
  .badge-discovery { background: #1e3a5f; color: #60a5fa; }
  .badge-research { background: #1e3a5f; color: #60a5fa; }
  .badge-script { background: #3f3f00; color: #facc15; }
  .badge-evidence { background: #7c2d12; color: #fb923c; }
  .badge-human { background: #7c2d12; color: #fb923c; }
  .badge-production { background: #581c87; color: #c084fc; }
  .badge-assembly { background: #581c87; color: #c084fc; }
  .badge-quality { background: #7c2d12; color: #fb923c; }
  .badge-packaging { background: #3f3f00; color: #facc15; }
  .badge-approval { background: #7c2d12; color: #fb923c; }
  .badge-published { background: #064e3b; color: #34d399; }
  .badge-pass { background: #064e3b; color: #34d399; }
  .badge-fail { background: #450a0a; color: #f87171; }
  .badge-pending { background: #3f3f00; color: #facc15; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-size: 0.7rem; text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #334155; margin-bottom: 16px; overflow-x: auto; }
  .tab { padding: 10px 16px; font-size: 0.875rem; color: #94a3b8; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  .tab.active { color: #f59e0b; border-bottom-color: #f59e0b; }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
    border-radius: 6px; color: #f8fafc; font-size: 0.875rem; font-family: inherit;
  }
  textarea { min-height: 80px; resize: vertical; }
  .claim-card { border-left: 3px solid #334155; padding-left: 12px; margin-bottom: 16px; }
  .claim-card.pass { border-left-color: #22c55e; }
  .claim-card.fail { border-left-color: #ef4444; }
  .claim-card.pending { border-left-color: #f59e0b; }
  .claim-text { font-size: 0.95rem; margin-bottom: 4px; }
  .claim-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
  .scripture-box { background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 10px; margin: 6px 0; font-style: italic; }
  .scripture-ref { font-weight: 700; color: #f59e0b; font-size: 0.75rem; margin-bottom: 4px; font-style: normal; }
  .violation-box { background: #450a0a; border: 1px solid #7f1d1d; border-radius: 6px; padding: 10px; margin: 6px 0; font-size: 0.75rem; }
  .pipeline { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin: 12px 0; }
  .pipeline-step { padding: 5px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; background: #334155; color: #94a3b8; }
  .pipeline-step.done { background: #064e3b; color: #34d399; }
  .pipeline-step.current { background: #f59e0b; color: #0f172a; }
  .loading { text-align: center; padding: 40px; color: #94a3b8; }
  .error { color: #ef4444; padding: 20px; text-align: center; }
  .empty { text-align: center; padding: 40px; color: #94a3b8; }
  .success { color: #22c55e; padding: 12px; background: #064e3b; border-radius: 6px; margin-bottom: 12px; font-size: 0.875rem; }
  .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>Answers in Faith</h1>
    <small>Theological Review Dashboard</small>
  </div>
  <button class="btn btn-primary" onclick="showNew()">+ New Production</button>
</div>

<div id="app">
  <div class="loading">Loading productions...</div>
</div>

<script>
const API_URL = 'https://answerbible-production-f7e6.up.railway.app/api';
const API_BASE = API_URL.replace(/\/api$/, '');

async function api(path, opts = {}) {
  const res = await fetch(API_URL + path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: 'Unknown error' }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  return res.json();
}

const STAGES = ['discovery','research','script','evidence_gate','human_review','production','assembly','quality_gate','packaging','approval','published'];
const STAGE_LABELS = {
  discovery:'Discovery', research:'Research', script:'Script', evidence_gate:'Evidence Gate',
  human_review:'Human Review', production:'Production', assembly:'Assembly',
  quality_gate:'Quality Gate', packaging:'Packaging', approval:'Approval', published:'Published'
};

let currentProd = null;
let currentTab = 'overview';

async function loadList() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Loading productions...</div>';
  try {
    const prods = await api('/productions');
    renderList(prods);
  } catch (e) {
    app.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

function renderList(prods) {
  const app = document.getElementById('app');
  if (!prods.length) {
    app.innerHTML = '<div class="empty">No productions yet. Tap "+ New Production" to start.</div>';
    return;
  }
  let html = '<div class="card"><table><thead><tr><th>Topic</th><th>Category</th><th>Scripture</th><th>Stage</th><th style="width:50px"></th></tr></thead><tbody>';
  for (const p of prods) {
    html += '<tr style="cursor:pointer" onclick="loadDetail(\'' + p.id + '\')">'
      + '<td><strong>' + escapeHtml(p.topic) + '</strong></td>'
      + '<td style="text-transform:capitalize">' + (p.doctrinal_category ? p.doctrinal_category.replace(/_/g,' ') : '') + '</td>'
      + '<td>' + (p.primary_scripture || '—') + '</td>'
      + '<td>' + stageBadge(p.stage) + '</td>'
      + '<td><button class="btn btn-danger" style="padding:4px 8px;font-size:0.75rem" title="Delete production" onclick="event.stopPropagation();doDelete(\'' + p.id + '\')">🗑</button></td>'
      + '</tr>';
  }
  html += '</tbody></table></div>';
  app.innerHTML = html;
}

async function doDelete(id) {
  if (!confirm('Delete this production permanently? This cannot be undone.')) return;
  try {
    await api('/productions/' + id, { method: 'DELETE' });
    loadList();
  } catch (e) { alert('Error: ' + e.message); }
}

async function loadDetail(id) {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Loading...</div>';
  try {
    currentProd = await api('/productions/' + id);
    currentTab = 'overview';
    renderDetail();
  } catch (e) {
    app.innerHTML = '<div class="error">Error: ' + e.message + '</div>';
  }
}

function researchLinksHtml(p) {
  const q = (p.primary_scripture || '').trim() || (p.topic || '').trim();
  if (!q) return '';
  const enc = encodeURIComponent(q);
  return '<div style="margin:12px 0;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:6px">'
    + '<div style="font-weight:600;margin-bottom:4px">Research "' + escapeHtml(q) + '"</div>'
    + '<div style="font-size:0.75rem;color:#94a3b8;margin-bottom:8px">Opens in a new tab</div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap">'
    + '<a class="btn btn-outline" style="font-size:0.75rem;padding:6px 10px;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://www.biblegateway.com/passage/?search=' + enc + '&version=NIV">📖 BibleGateway</a>'
    + '<a class="btn btn-outline" style="font-size:0.75rem;padding:6px 10px;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://biblehub.com/search?q=' + enc + '">🔤 BibleHub</a>'
    + '<a class="btn btn-outline" style="font-size:0.75rem;padding:6px 10px;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://scholar.google.com/scholar?q=' + enc + '">🎓 Scholar</a>'
    + '<a class="btn btn-outline" style="font-size:0.75rem;padding:6px 10px;text-decoration:none" target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=' + enc + '">🌐 Google</a>'
    + '</div></div>';
}

function videoHtml(p) {
  let videoSrc = null, captionsSrc = null;
  if (p.video_url) videoSrc = p.video_url.indexOf('http') === 0 ? p.video_url : API_BASE + p.video_url;
  else if (p.has_video) videoSrc = API_BASE + '/api/download/' + p.id;
  if (p.captions_url) captionsSrc = p.captions_url.indexOf('http') === 0 ? p.captions_url : API_BASE + p.captions_url;
  else if (p.has_video) captionsSrc = API_BASE + '/api/download-captions/' + p.id;
  if (!videoSrc) return '';
  let h = '<video controls preload="metadata" src="' + videoSrc + '" style="width:100%;border-radius:6px;background:#000;margin-top:12px"></video>'
    + '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'
    + '<a class="btn btn-primary" style="text-decoration:none" href="' + videoSrc + '" download>⬇ Download Video</a>';
  if (captionsSrc) h += '<a class="btn btn-outline" style="text-decoration:none" href="' + captionsSrc + '" download>⬇ Captions (.srt)</a>';
  h += '</div>';
  return h;
}

function renderDetail() {
  const p = currentProd;
  const app = document.getElementById('app');
  const idx = STAGES.indexOf(p.stage);

  let pipeline = '<div class="pipeline">';
  for (let i = 0; i < STAGES.length; i++) {
    const cls = i < idx ? 'done' : i === idx ? 'current' : '';
    pipeline += '<div class="pipeline-step ' + cls + '">' + STAGE_LABELS[STAGES[i]] + '</div>';
    if (i < STAGES.length - 1) pipeline += '<span style="color:#334155">→</span>';
  }
  pipeline += '</div>';

  let html = ''
    + '<button class="btn btn-outline" onclick="loadList()" style="margin-bottom:12px">← Back</button>'
    + '<div class="card">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">'
    + '<div>'
    + '<div class="card-title">' + escapeHtml(p.topic) + '</div>'
    + '<div style="font-size:0.75rem;color:#94a3b8">'
    + (p.primary_scripture ? '📖 ' + p.primary_scripture + ' | ' : '')
    + (p.doctrinal_category ? p.doctrinal_category.replace(/_/g,' ') : '') + ' | '
    + (p.gospel_video ? '⛪ Gospel | ' : '')
    + 'Approved: ' + (p.approved_by || '—')
    + '</div></div>'
    + '<div style="display:flex;gap:6px;align-items:center">'
    + stageBadge(p.stage)
    + '<button class="btn btn-danger" onclick="doDelete(\'' + p.id + '\')">🗑 Delete</button>'
    + '</div></div>'
    + pipeline
    + videoHtml(p)
    + '</div>'
    + '<div class="tabs">'
    + '<button class="tab ' + (currentTab==='overview'?'active':'') + '" onclick="setTab(\'overview\')">Overview</button>'
    + '<button class="tab ' + (currentTab==='claims'?'active':'') + '" onclick="setTab(\'claims\')">Claims</button>'
    + '<button class="tab ' + (currentTab==='scenes'?'active':'') + '" onclick="setTab(\'scenes\')">Scenes</button>'
    + '<button class="tab ' + (currentTab==='actions'?'active':'') + '" onclick="setTab(\'actions\')">'
    + ((p.requires_manual_review && p.stage==='evidence_gate') ? '<span style="color:#ef4444">●</span> ' : '') + 'Actions'
    + '</button></div>';

  if (currentTab === 'overview') {
    html += '<div class="card"><div class="card-title">Overview</div>'
      + researchLinksHtml(p)
      + (p.hook ? '<p style="margin-bottom:10px"><strong>Hook:</strong> ' + escapeHtml(p.hook) + '</p>' : '')
      + (p.problem ? '<p style="margin-bottom:10px"><strong>Problem:</strong> ' + escapeHtml(p.problem) + '</p>' : '')
      + (p.explanation ? '<p style="margin-bottom:10px"><strong>Explanation:</strong> ' + escapeHtml(p.explanation) + '</p>' : '')
      + (p.story ? '<p style="margin-bottom:10px"><strong>Story:</strong> ' + escapeHtml(p.story) + '</p>' : '')
      + (p.application ? '<p style="margin-bottom:10px"><strong>Application:</strong> ' + escapeHtml(p.application) + '</p>' : '')
      + (p.cta ? '<p><strong>CTA:</strong> ' + escapeHtml(p.cta) + '</p>' : '')
      + (!p.hook ? '<div class="empty">No research submitted yet.</div>' : '')
      + '</div>';
  }

  if (currentTab === 'claims') {
    html += '<div class="card"><div class="card-title">Claims</div>';
    if (!p.claims.length) html += '<div class="empty">No claims submitted yet.</div>';
    for (const c of p.claims) {
      const statusClass = c.status === 'pass' ? 'pass' : c.status === 'fail' ? 'fail' : 'pending';
      html += '<div class="claim-card ' + statusClass + '">'
        + '<div class="claim-text">' + escapeHtml(c.text) + '</div>'
        + '<div class="claim-meta">'
        + '<span class="badge badge-' + c.confidence + '">' + c.confidence + '</span> '
        + '<span class="badge badge-' + c.type + '">' + c.type.replace(/_/g,' ') + '</span> '
        + '<span class="badge badge-' + c.status + '">' + c.status + '</span>'
        + '</div>';
      if (c.source_reference) {
        html += '<div class="scripture-box"><div class="scripture-ref">' + escapeHtml(c.source_reference) + '</div>' + escapeHtml(c.source_text || '') + '</div>';
      }
      if (c.context) {
        html += '<div style="margin:6px 0;font-size:0.8125rem;color:#94a3b8"><strong style="color:#f8fafc">Context:</strong> ' + escapeHtml(c.context) + '</div>';
      }
      if (c.interpretation) {
        html += '<div style="margin:6px 0;font-size:0.8125rem;color:#94a3b8"><strong style="color:#f8fafc">Interpretation:</strong> ' + escapeHtml(c.interpretation) + '</div>';
      }
      if (c.cross_references && c.cross_references.length) {
        html += '<div style="margin:6px 0;font-size:0.8125rem"><strong style="color:#f8fafc">Cross-refs:</strong> ' + c.cross_references.join(', ') + '</div>';
      }
      if (c.alternative_interpretations) {
        html += '<div style="margin:6px 0;font-size:0.8125rem;color:#94a3b8"><strong style="color:#f8fafc">Alternative Views:</strong> ' + escapeHtml(c.alternative_interpretations) + '</div>';
      }
      if (c.evidence_notes && c.status === 'fail') {
        html += '<div class="violation-box"><strong>Violation:</strong> ' + escapeHtml(c.evidence_notes) + '</div>';
      }
      html += '</div>';
    }
    html += '</div>';
  }

  if (currentTab === 'scenes') {
    html += '<div class="card"><div class="card-title">Scenes</div>';
    if (!p.scenes.length) html += '<div class="empty">No scenes submitted yet.</div>';
    for (const s of p.scenes) {
      html += '<div class="claim-card" style="border-left-color:#334155">'
        + '<div style="font-weight:700;margin-bottom:4px">Scene ' + (s.order + 1) + '</div>'
        + '<div style="font-size:0.875rem;margin-bottom:4px">' + escapeHtml(s.narration_text || '(no narration)') + '</div>'
        + '<div style="font-size:0.75rem;color:#94a3b8;font-style:italic">' + escapeHtml(s.visual_prompt || '') + '</div>'
        + '<div style="margin-top:6px"><span class="badge badge-' + s.status + '">' + s.status + '</span>' + (s.locked ? ' <span class="badge" style="background:#334155">Locked</span>' : '') + '</div>'
        + '</div>';
    }
    html += '</div>';
  }

  if (currentTab === 'actions') {
    html += '<div id="actions-panel">';
    
    if (p.stage === 'discovery') {
      html += '<div class="card" style="border:1px dashed #f59e0b">'
        + '<div class="card-title">⚡ Auto-Research</div>'
        + '<p style="color:#94a3b8;font-size:0.875rem;margin-bottom:12px">Let AI draft the 6 research fields from your topic + scripture. You review the draft before anything advances.</p>'
        + '<button class="btn btn-primary" onclick="doAutoResearch(\'' + p.id + '\')">⚡ Draft Research with AI</button>'
        + '</div>';
      html += '<div class="card">'
        + '<div class="card-title">Submit Research</div>'
        + '<div class="form-group"><label>Hook</label><input id="rHook" placeholder="Grab attention in first 5 seconds"></div>'
        + '<div class="form-group"><label>Problem</label><input id="rProblem" placeholder="What pain point does this address?"></div>'
        + '<div class="form-group"><label>Explanation</label><textarea id="rExplanation" placeholder="Core theological explanation"></textarea></div>'
        + '<div class="form-group"><label>Story</label><textarea id="rStory" placeholder="Illustrative story or example"></textarea></div>'
        + '<div class="form-group"><label>Application</label><textarea id="rApplication" placeholder="How does this apply to the viewer?"></textarea></div>'
        + '<div class="form-group"><label>CTA</label><input id="rCta" placeholder="Subscribe, comment, etc."></div>'
        + '<button class="btn btn-primary" onclick="submitResearch(\'' + p.id + '\')">Submit Research</button>'
        + '</div>';
    }
    
    else if (p.stage === 'research') {
      html += '<div class="card">'
        + '<div class="card-title">Submit Script & Claims</div>'
        + '<div class="card-title" style="margin-top:16px;font-size:1rem">Claim 1</div>'
        + '<div class="form-group"><label>Claim Text *</label><input id="cText" placeholder="The theological claim you are making"></div>'
        + '<div class="form-group"><label>Source Reference *</label><input id="cSourceRef" placeholder="e.g., Genesis 6:2"></div>'
        + '<div class="form-group"><label>Source Text *</label><textarea id="cSourceText" placeholder="The actual biblical text"></textarea></div>'
        + '<div class="form-group"><label>Original Language</label><input id="cLang" placeholder="e.g., Hebrew"></div>'
        + '<div class="form-group"><label>Context * (min 50 chars required)</label><textarea id="cContext" placeholder="Historical, literary, cultural context. MUST be 50+ characters or gate will block."></textarea><div class="hint" id="contextCount">0 characters</div></div>'
        + '<div class="form-group"><label>Interpretation *</label><textarea id="cInterp" placeholder="Your exegesis of this passage"></textarea></div>'
        + '<div class="form-group"><label>Confidence</label><select id="cConfidence"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>'
        + '<div class="form-group"><label>Claim Type</label><select id="cType"><option value="scripture">Scripture (direct biblical statement)</option><option value="strong_inference">Strong Inference</option><option value="traditional">Traditional Interpretation</option><option value="scholarly" selected>Scholarly Opinion</option><option value="speculation">Speculation (cannot present as fact)</option></select></div>'
        + '<div class="form-group"><label>Cross References (comma separated)</label><input id="cCross" placeholder="Job 1:6, Job 38:7, Psalm 82:6"></div>'
        + '<div class="form-group"><label>Alternative Interpretations</label><textarea id="cAlt" placeholder="Other views to acknowledge"></textarea></div>'
        + '<div class="card-title" style="margin-top:20px;font-size:1rem">Scene 1</div>'
        + '<div class="form-group"><label>Narration Text *</label><textarea id="sNarration" placeholder="What the voiceover says"></textarea></div>'
        + '<div class="form-group"><label>Visual Prompt *</label><input id="sVisual" placeholder="e.g., Ancient scroll unfurling, dark atmosphere"></div>'
        + '<button class="btn btn-primary" onclick="submitScript(\'' + p.id + '\')">Submit Script & Claims</button>'
        + '</div>';
    }
    
    else if (p.stage === 'script') {
      html += '<div class="card"><div class="card-title">Run Evidence Gate</div>'
        + '<p style="color:#94a3b8;font-size:0.875rem;margin-bottom:12px">Run the 12 theological blockers against all claims.</p>'
        + '<button class="btn btn-primary" onclick="runGate(\'' + p.id + '\')">Run Evidence Gate</button></div>';
    }
    
    else if (p.stage === 'evidence_gate') {
      html += '<div class="card" style="border-left:3px solid #f59e0b">'
        + '<div class="card-title">🛡️ Human Review Required</div>'
        + '<p style="color:#94a3b8;font-size:0.875rem;margin-bottom:12px">This production requires your explicit approval.</p>'
        + '<div class="form-group"><label>Reviewer</label><input id="reviewer" value="david"></div>'
        + '<div class="form-group"><label>Notes</label><textarea id="reviewNotes" placeholder="Approval notes..."></textarea></div>'
        + '<div style="display:flex;gap:8px">'
        + '<button class="btn btn-success" onclick="doReview(\'' + p.id + '\',\'pass\')">✓ Approve</button>'
        + '<button class="btn btn-danger" onclick="doReview(\'' + p.id + '\',\'repair\')">Send Back</button>'
        + '</div></div>';
    }
    
    else if (p.stage === 'human_review') {
      html += '<div class="card"><div class="card-title">Start Production</div>'
        + '<p style="color:#94a3b8;font-size:0.875rem;margin-bottom:12px">Generate TTS, visuals, and assemble video.</p>'
        + '<button class="btn btn-primary" onclick="doProduce(\'' + p.id + '\')">Start Production</button></div>';
    }
    
    else if (p.stage === 'quality_gate') {
      html += '<div class="card" style="border-left:3px solid #3b82f6">'
        + '<div class="card-title">Quality Gate</div>'
        + '<div class="form-group"><label>Reviewer</label><input id="qReviewer" value="david"></div>'
        + '<div class="form-group"><label>Notes</label><textarea id="qNotes"></textarea></div>'
        + '<div style="display:flex;gap:8px">'
        + '<button class="btn btn-success" onclick="doQuality(\'' + p.id + '\',\'pass\')">Pass</button>'
        + '<button class="btn btn-danger" onclick="doQuality(\'' + p.id + '\',\'repair\')">Needs Repair</button>'
        + '</div></div>';
    }
    
    else if (p.stage === 'packaging') {
      html += '<div class="card" style="border-left:3px solid #f59e0b">'
        + '<div class="card-title">Packaging</div>'
        + '<div class="form-group"><label>Title</label><input id="pTitle" value="' + escapeHtml(p.title || '') + '"></div>'
        + '<div class="form-group"><label>Description</label><textarea id="pDesc">' + escapeHtml(p.description || '') + '</textarea></div>'
        + '<div class="form-group"><label>Keywords (comma separated)</label><input id="pKeywords" value="' + escapeHtml(p.keywords || '') + '"></div>'
        + '<div class="form-group"><label>Thumbnail Prompt</label><input id="pThumb" value="' + escapeHtml(p.thumbnail_prompt || '') + '"></div>'
        + '<button class="btn btn-primary" onclick="doPackaging(\'' + p.id + '\')">Save Packaging</button></div>';
    }
    
    else if (p.stage === 'approval') {
      html += '<div class="card" style="border-left:3px solid #22c55e">'
        + '<div class="card-title">Final Approval</div>'
        + '<div class="form-group"><label>Reviewer</label><input id="aReviewer" value="david"></div>'
        + '<div class="form-group"><label>Notes</label><textarea id="aNotes"></textarea></div>'
        + '<button class="btn btn-success" onclick="doApprove(\'' + p.id + '\')">🚀 Final Approve</button></div>';
    }
    
    else {
      html += '<div class="card empty">No actions available at stage <strong>' + STAGE_LABELS[p.stage] + '</strong>. '
        + (p.stage==='production' ? 'Production running in background...' : '')
        + (p.stage==='assembly' ? 'Video assembling...' : '')
        + (p.stage==='published' ? 'This production has been published.' : '')
        + '</div>';
    }
    
    html += '</div>';
  }

  app.innerHTML = html;
  
  const ctx = document.getElementById('cContext');
  if (ctx) {
    ctx.addEventListener('input', function() {
      document.getElementById('contextCount').textContent = this.value.length + ' characters' + (this.value.length < 50 ? ' (need 50+)' : ' ✓');
      document.getElementById('contextCount').style.color = this.value.length < 50 ? '#ef4444' : '#22c55e';
    });
  }
}

function setTab(tab) { currentTab = tab; renderDetail(); }

async function doAutoResearch(id) {
  try {
    const res = await api('/productions/' + id + '/auto-research', { method: 'POST' });
    let msg = res.message || 'Draft saved. Review it on the Overview tab.';
    const d = res.draft || {};
    if (d.suggested_title) msg += '\n\n🎬 Theme: ' + d.suggested_title;
    if (d.suggested_scripture) msg += '\n📖 Scripture: ' + d.suggested_scripture;
    alert(msg);
    loadDetail(id);
  } catch (e) { alert('Error: ' + e.message); }
}

async function submitResearch(id) {
  const data = {
    hook: document.getElementById('rHook').value,
    problem: document.getElementById('rProblem').value,
    explanation: document.getElementById('rExplanation').value,
    story: document.getElementById('rStory').value,
    application: document.getElementById('rApplication').value,
    cta: document.getElementById('rCta').value,
  };
  try {
    await api('/productions/' + id + '/research', { method: 'POST', body: JSON.stringify(data) });
    loadDetail(id);
  } catch (e) { alert('Error: ' + e.message); }
}

async function submitScript(id) {
  const context = document.getElementById('cContext').value;
  if (context.length < 50) {
    alert('Context must be at least 50 characters. Currently: ' + context.length);
    return;
  }
  
  const data = {
    claims: [{
      claim_text: document.getElementById('cText').value,
      source_reference: document.getElementById('cSourceRef').value,
      source_text: document.getElementById('cSourceText').value,
      original_language: document.getElementById('cLang').value || 'Hebrew',
      context: context,
      interpretation: document.getElementById('cInterp').value,
      confidence: document.getElementById('cConfidence').value,
      claim_type: document.getElementById('cType').value,
      cross_references: document.getElementById('cCross').value.split(',').map(function(s){return s.trim()}).filter(Boolean),
      alternative_interpretations: document.getElementById('cAlt').value,
    }],
    scenes: [{
      order_index: 0,
      narration_text: document.getElementById('sNarration').value,
      visual_prompt: document.getElementById('sVisual').value,
      claim_ids: [0]
    }]
  };
  
  if (!data.claims[0].claim_text || !data.claims[0].source_reference || !data.claims[0].source_text || !data.claims[0].interpretation) {
    alert('Please fill in all required claim fields (marked with *)');
    return;
  }
  if (!data.scenes[0].narration_text || !data.scenes[0].visual_prompt) {
    alert('Please fill in all required scene fields');
    return;
  }
  
  try {
    await api('/productions/' + id + '/script', { method: 'POST', body: JSON.stringify(data) });
    loadDetail(id);
  } catch (e) { alert('Error: ' + e.message); }
}

async function runGate(id) {
  try {
    const res = await api('/productions/' + id + '/evidence', { method: 'POST' });
    if (res.decision === 'FAIL') {
      alert('Evidence Gate FAILED:\n\n' + res.violations.map(function(v){return '• ' + v.detail}).join('\n') + '\n\nFix the issues and resubmit script.');
    }
    loadDetail(id);
  } catch (e) { alert('Error: ' + e.message); }
}

function fv(id) { const el = document.getElementById(id); return el ? el.value : ''; }

async function doAiFill() {
  const topic = fv('nTopic').trim();
  if (!topic) { alert('Type your line or question first'); return; }
  const st = document.getElementById('aiStatus');
  st.textContent = '⚡ Researching... (~30 sec)';
  let tempId = null;
  try {
    const tmp = await api('/productions', { method: 'POST', body: JSON.stringify({ topic: topic, doctrinal_category: 'general', gospel_video: false }) });
    tempId = tmp.id;
    const res = await api('/productions/' + tempId + '/auto-research', { method: 'POST' });
    try { await api('/productions/' + tempId, { method: 'DELETE' }); } catch (e2) {}
    tempId = null;
    const d = res.draft || {};
    document.getElementById('rHook').value = d.hook || '';
    document.getElementById('rProblem').value = d.problem || '';
    document.getElementById('rExplanation').value = d.explanation || '';
    document.getElementById('rStory').value = d.story || '';
    document.getElementById('rApplication').value = d.application || '';
    document.getElementById('rCta').value = d.cta || '';
    let theme = '';
    if (d.suggested_title) theme += '<strong>🎬 Theme:</strong> ' + escapeHtml(d.suggested_title) + '<br>';
    if (d.suggested_scripture) theme += '<strong>📖 Scripture:</strong> ' + escapeHtml(d.suggested_scripture) + ' ';
    theme += '<span style="color:#94a3b8">— suggestions applied below, edit freely</span>';
    document.getElementById('aiTheme').innerHTML = theme;
    if (d.suggested_scripture) document.getElementById('nScripture').value = d.suggested_scripture;
    if (d.suggested_category) document.getElementById('nCat').value = d.suggested_category;
    document.getElementById('draftWrap').style.display = 'block';
    document.getElementById('detailsCard').style.display = 'block';
    st.textContent = '✅ Draft ready — review, edit anything, then approve below.';
  } catch (e) {
    if (tempId) { try { await api('/productions/' + tempId, { method: 'DELETE' }); } catch (e2) {} }
    st.textContent = '';
    alert('Error: ' + e.message);
  }
}

async function doCreate() {
  const topic = fv('nTopic').trim();
  if (!topic) { alert('Type your line or question first'); return; }
  const data = {
    topic: topic,
    source_question: fv('nQuestion'),
    doctrinal_category: fv('nCat') || 'general',
    primary_scripture: fv('nScripture'),
    gospel_video: document.getElementById('nGospel') ? document.getElementById('nGospel').checked : false,
  };
  try {
    const res = await api('/productions', { method: 'POST', body: JSON.stringify(data) });
    const research = {
      hook: fv('rHook'), problem: fv('rProblem'), explanation: fv('rExplanation'),
      story: fv('rStory'), application: fv('rApplication'), cta: fv('rCta')
    };
    if (research.hook || research.problem || research.explanation || research.story || research.application || research.cta) {
      await api('/productions/' + res.id + '/research', { method: 'POST', body: JSON.stringify(research) });
    }
    loadDetail(res.id);
  } catch (e) { alert('Error: ' + e.message); }
}

function stageBadge(stage) {
  return '<span class="badge badge-' + stage + '">' + (STAGE_LABELS[stage] || stage) + '</span>';
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
